services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    environment:
      - DATA_DIR=/app/data/raw
      - MANTISGRID_URL=http://mantisgrid-api:8000
    depends_on:
      - mantisgrid-api

  dashboard:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api

  # The real MantisGrid AI facsimile API (Layer A: findings/causal/neighbor/rules,
  # Layer B: efficiency/waste/recommendations), built from data/prepped + data/synthetic.
  # Runs alongside the dashboard's own backend on a separate port so both are inspectable.
  mantisgrid-api:
    build:
      context: .
      dockerfile: api/Dockerfile.local
    ports:
      - "8001:8000"
    volumes:
      - ./api:/app/api:ro
      - ./data:/app/data:ro

  # Run once after downloading raw data into data/raw/ (data/ is gitignored,
  # not committed -- see data/README.md):
  #   docker compose run --rm prep
  prep:
    build:
      context: .
      dockerfile: api/Dockerfile.local
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts:ro
    command: ["python", "scripts/prep_data.py"]
    profiles: ["tools"]

  # docker compose run --rm generate
  generate:
    build:
      context: .
      dockerfile: api/Dockerfile.local
    volumes:
      - ./data:/app/data
      - ./bin:/app/bin:ro
    command: ["sh", "-c",
      "a=$$(uname -m); case $$a in x86_64|amd64) a=amd64;; aarch64|arm64) a=arm64;; esac; cp bin/mantisgrid-generate-linux-$$a /tmp/gen && chmod +x /tmp/gen && /tmp/gen data"]
    profiles: ["tools"]
